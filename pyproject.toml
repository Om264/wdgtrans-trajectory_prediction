[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wdgtrans"
version = "0.1.0"
description = "Weighted Dynamic Graph Transformer (W-DGTrans) for multi-agent trajectory prediction"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy", "pyyaml", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["wdgtrans*"]
